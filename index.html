<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Коллекция открывается по секретной ссылке.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; connect-src 'self' https://cdnjs.cloudflare.com; frame-src 'self' blob:; img-src 'self' data:; font-src https://cdnjs.cloudflare.com data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Коллекция проектов</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f8f9f4;color:#292c29;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .gate{min-height:100vh;display:grid;place-items:center;padding:28px}.panel{max-width:420px;width:100%;padding:36px;border:1px solid #e1e4da;border-radius:16px;background:#fff}.lock{width:40px;height:40px;margin-bottom:23px;color:#718568}h1{font-size:27px;font-weight:580;letter-spacing:-1px;margin:0 0 14px}p{font-size:14px;line-height:1.7;margin:0;color:#777b73}#status{min-height:48px}iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#f8f9f4}iframe[hidden],.gate[hidden]{display:none}.error{color:#965e4e!important}button{font:inherit;color:#4c6541;border:1px solid #dce2d2;background:#edf1e7;border-radius:7px;padding:10px 14px;margin-top:18px;cursor:pointer}button:focus-visible{outline:2px solid #607954;outline-offset:4px}
  </style>
  <script src="vault.js" defer></script>
</head>
<body>
  <main class="gate" id="gate">
    <div class="panel">
      <svg class="lock" viewBox="0 0 40 40" aria-hidden="true"><rect x="10" y="18" width="20" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M14 18v-7a6 6 0 0 1 12 0v7m-6 7v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <h1>Коллекция проектов</h1>
      <p id="status" role="status" aria-live="polite">Откройте полную секретную ссылку, чтобы увидеть коллекцию.</p>
      <button id="retry" hidden>Попробовать снова</button>
    </div>
  </main>
  <iframe id="content" title="Коллекция проектов" sandbox="allow-scripts allow-downloads allow-top-navigation-by-user-activation" referrerpolicy="no-referrer" hidden></iframe>
</body>
</html>
